name: Meanwhile
description: 'Meanwhile is the first BMA-licensed innovative life insurer in Bermuda, offering whole
  life insurance policies denominated entirely in Bitcoin rather than fiat. Its BTC Life product lets
  customers pay premiums in Bitcoin that grow at a guaranteed rate in Bitcoin terms, borrow tax-free
  against up to 90% of policy value after one year, and pass a full day-one death benefit to
  beneficiaries without managing wallets or seed phrases. The company is backed by Pantera, Bain
  Capital Crypto, Sam Altman, Northwestern Mutual, and Framework Ventures, and raised $82M in October
  2025. Meanwhile publishes no public developer API, portal, or SDKs; this profile captures its
  identity, public web properties, and probed domain-security posture.'
